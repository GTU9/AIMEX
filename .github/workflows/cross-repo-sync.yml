name: Conditional Repository Sync

on:
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'vllm/**'
jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      backend-changed: ${{ steps.changes.outputs.backend }}
      vllm-changed: ${{ steps.changes.outputs.vllm }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          if echo "$CHANGED_FILES" | grep -q "^frontend/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "Frontend changes detected"
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
            echo "No frontend changes"
          fi
          
          if echo "$CHANGED_FILES" | grep -q "^backend/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "Backend changes detected"
          else
            echo "backend=false" >> $GITHUB_OUTPUT
            echo "No backend changes"
          fi

          if echo "$CHANGED_FILES" | grep -q "^vllm/"; then
            echo "vllm=true" >> $GITHUB_OUTPUT
            echo "vllm changes detected"
          else
            echo "vllm=false" >> $GITHUB_OUTPUT
            echo "No vllm changes"
          fi

  sync-frontend:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.frontend-changed == 'true'
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "kicet3"
          git config --global user.email "kicet3@gmail.com"

      - name: Clone and setup frontend repository
        run: |
          cd ../
          # 기존 디렉토리 삭제
          rm -rf frontend-repo
          # 새로 클론
          git clone https://${{ secrets.FRONTEND_REPO_TOKEN }}@github.com/kicet3/AIMex-front.git frontend-repo
          
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}

      - name: Copy frontend files
        run: |
          cd ../
           # .git을 제외한 모든 내용 삭제
          shopt -s dotglob
          for item in ./frontend-repo/*; do
            if [[ "$(basename "$item")" != ".git" ]]; then
              rm -rf "$item"
            fi
          done
          cp -r ./SKN11-FINAL-4Team/frontend/* ./frontend-repo/
          
      - name: Commit and push to frontend repository
        run: |
          cd ../
          cd frontend-repo

          # 현재 원격 저장소 확인
          echo "푸시 전 원격 저장소 확인:"
          git remote -v

          git add .
          
          if git diff --staged --quiet; then
            echo "Frontend: 변경사항이 없습니다."
            exit 0
          fi

          git commit -m "Sync frontend from develop: ${{ github.sha }}"
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}

  sync-backend:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.backend-changed == 'true'
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "kicet3"
          git config --global user.email "kicet3@gmail.com"

      - name: Clone and setup backend repository
        run: |
          cd ../
          # 기존 디렉토리 삭제
          rm -rf backend-repo
          # 새로 클론
          git clone https://${{ secrets.BACKEND_REPO_TOKEN }}@github.com/kicet3/AIMEX-back.git backend-repo
          
        env:
          BACKEND_REPO_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}

      - name: Copy backend files
        run: |
          cd ../
          shopt -s dotglob
          for item in ./backend-repo/*; do
            if [[ "$(basename "$item")" != ".git" ]]; then
              rm -rf "$item"
            fi
          done
          cp -r ./SKN11-FINAL-4Team/backend/* ./backend-repo/
          
      - name: Commit and push to backend repository
        run: |
          cd ../
          cd backend-repo

          # 현재 원격 저장소 확인
          echo "푸시 전 원격 저장소 확인:"
          git remote -v
          
          git add .
          
          if git diff --staged --quiet; then
            echo "Backend: 변경사항이 없습니다."
            exit 0
          fi
          
          git commit -m "Sync backend from develop: ${{ github.sha }}"
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}

  sync-vllm:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.vllm-changed == 'true'
    
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "kicet3"
          git config --global user.email "kicet3@gmail.com"

      - name: Clone and setup vllm repository
        run: |
          cd ../
          # 기존 디렉토리 삭제
          rm -rf vllm-repo
          # 새로 클론
          git clone https://${{ secrets.VLLM_REPO_TOKEN }}@github.com/kicet3/aimex-vllm.git vllm-repo

        env:
          VLLM_REPO_TOKEN: ${{ secrets.VLLM_REPO_TOKEN }}

      - name: Copy vllm files
        run: |
          cd ../
          shopt -s dotglob
          for item in ./vllm-repo/*; do
            if [[ "$(basename "$item")" != ".git" ]]; then
              rm -rf "$item"
            fi
          done
          cp -r ./SKN11-FINAL-4Team/vllm/* ./vllm-repo/
          
      - name: Commit and push to vllm repository
        run: |
          cd ../
          cd vllm-repo

          # 현재 원격 저장소 확인
          echo "푸시 전 원격 저장소 확인:"
          git remote -v
          
          git add .
          
          if git diff --staged --quiet; then
            echo "vllm: 변경사항이 없습니다."
            exit 0
          fi
          
          git commit -m "Sync vllm from develop: ${{ github.sha }}"
          git push origin main --force
        env:
          GITHUB_TOKEN: ${{ secrets.VLLM_REPO_TOKEN }}