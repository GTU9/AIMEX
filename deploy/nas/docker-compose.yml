  #     ETCD_USE_EMBED: "true"
  #     COMMON_STORAGETYPE: "local"
  #   volumes:
  #     - milvus_data:/var/lib/milvus
  #   restart: unless-stopped

volumes:
  db_data:
  minio_data:
